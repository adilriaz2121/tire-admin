name: Deploy Admin Panel

on:
  push:
    branches:
      - main # or 'master' depending on your repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Ensure /var/www permissions on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            echo "🔧 Ensuring /var/www permissions..."
            sudo mkdir -p /var/www/tire-admin
            sudo chown -R $USER:$USER /var/www
            sudo chmod -R 755 /var/www

      - name: Sync Admin Files via Rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude '.git' --exclude 'node_modules'
          path: .
          remote_path: /var/www/tire-admin
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USERNAME }}
          remote_key: ${{ secrets.SERVER_PRIVATE_KEY }}

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            echo "🚀 Deploying Admin Panel..."
            cd /var/www/tire-admin

            echo "📦 Installing dependencies..."
            npm install

            echo "🏗️ Building project..."
            npm run build || echo "No build step"

            echo "🔁 Restarting with PM2..."
            sudo npm install -g pm2 serve
            pm2 delete tire-admin || true
            pm2 start "serve -s build -l 3001" --name tire-admin
            pm2 save

            echo "🔧 Configuring Nginx..."
            echo '
            server {
                listen 80;
                server_name admin.cinefloat.site;

                location / {
                    proxy_pass http://localhost:3001;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            ' | sudo tee /etc/nginx/sites-available/tire-admin

            sudo ln -sf /etc/nginx/sites-available/tire-admin /etc/nginx/sites-enabled/
            sudo nginx -t
            sudo systemctl restart nginx

            echo "🔒 Enabling SSL..."
            sudo certbot --nginx -d admin.cinefloat.site --non-interactive --agree-tos -m admin@cinefloat.site || true

            echo "✅ Admin deployment complete!"
