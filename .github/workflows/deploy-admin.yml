name: Deploy to Ubuntu

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clean runner space
        run: |
          df -h
          sudo apt-get clean
          sudo rm -rf /tmp/* /var/tmp/*

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create .env file
        run: |
          echo "${{ secrets.SERVER_ENV }}" > .env

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run build

      # Upload everything needed for production
      - name: rsync deployments
        uses: burnett01/rsync-deployments@6.0.0
        timeout-minutes: 10
        with:
          switches: -avzr --delete --exclude 'node_modules' --exclude '.git*' --exclude 'README.md' --exclude '.next/cache' -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          path: .
          remote_path: /home/ubuntu/tire-admin
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USERNAME }}
          remote_key: ${{ secrets.SERVER_PRIVATE_KEY }}
          remote_port: ${{ secrets.SERVER_PORT || 22 }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 15
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 10m
          script: |
            # Use system-wide Node instead of NVM
            # Install Node.js if not installed
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            cd /home/ubuntu/tire-admin

            # Install dependencies
            echo "📦 Installing dependencies..."
            export NODE_OPTIONS="--max-old-space-size=2048"
            npm install --production

            # Stop existing PM2 process
            pm2 stop tire-admin || true
            pm2 delete tire-admin || true

            # Verify Next.js is installed
            if [ -f "node_modules/.bin/next" ]; then
              echo "✅ Next.js found!"
            else
              echo "❌ Next.js not found! This will cause issues."
              exit 1
            fi

            # Start app with PM2
            echo "🚀 Starting application..."
            pm2 start npm --name "tire-admin" -- start

            # Save PM2 configuration
            pm2 save

            # Setup PM2 startup (make PM2 run on reboot)
            sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu || true

            echo "✅ Deployment completed successfully!"
            pm2 list
