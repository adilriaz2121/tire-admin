name: Deploy to Ubuntu

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3️⃣ Create .env file
      - name: Create .env file
        run: echo "${{ secrets.SERVER_ENV }}" > .env

      # 4️⃣ Install dependencies (build-time only)
      - name: Install dependencies
        run: npm install

      # 5️⃣ Build Next.js project (produces standalone)
      - name: Build project
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run build

      # 6️⃣ Rsync upload to server (standalone node_modules included)
      - name: Upload build to server
        uses: burnett01/rsync-deployments@6.0.0
        timeout-minutes: 15
        with:
          switches: "-avzr --delete --exclude='.git*' --exclude='README.md' --exclude='node_modules' --exclude='.next/cache' --include='.next/standalone/node_modules/**'"
          path: .
          remote_path: /home/ubuntu/tire-admin
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USERNAME }}
          remote_key: ${{ secrets.SERVER_PRIVATE_KEY }}
          remote_port: ${{ secrets.SERVER_PORT || 22 }}

      # 7️⃣ Restart PM2 on server
      - name: Restart app on server
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Ensure Node.js exists
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            cd /home/ubuntu/tire-admin

            echo "🚀 Restarting tire-admin..."

            # Stop existing PM2 process if any
            pm2 stop tire-admin || true
            pm2 delete tire-admin || true

            # Start standalone server
            pm2 start .next/standalone/server.js --name tire-admin
            pm2 save

            # Ensure PM2 runs on reboot
            sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu || true

            # Show PM2 status
            pm2 list
